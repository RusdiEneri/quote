<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Halaman Tidak Ditemukan | Quote Studio</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-body: #FFFDF9;
        --text-primary: #121316;
        --text-muted: #575A65;
        --color-primary: #FFE74C;
        --color-secondary: #FF5E5B;
        --color-accent-blue: #00F0FF;
        --color-accent-green: #05FFA1;
        --border-color: #121316;
        --shadow-color: #121316;
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-body: #0E0F12;
          --text-primary: #F4F5F8;
          --text-muted: #A0A4B0;
          --border-color: #F4F5F8;
          --shadow-color: #F4F5F8;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--bg-body);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      .error-card {
        max-width: 580px;
        width: 100%;
        background: #ffffff;
        border: 4px solid var(--border-color);
        box-shadow: 8px 8px 0px var(--shadow-color);
        border-radius: 8px;
        padding: 2.5rem 2rem;
        text-align: center;
      }

      @media (prefers-color-scheme: dark) {
        .error-card {
          background: #18191E;
        }
      }

      .badge-404 {
        display: inline-block;
        font-family: var(--font-mono);
        font-weight: 800;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 0.35rem 0.85rem;
        background: var(--color-secondary);
        color: #ffffff;
        border: 2.5px solid var(--border-color);
        box-shadow: 3px 3px 0px var(--shadow-color);
        border-radius: 4px;
        margin-bottom: 1.25rem;
      }

      .glitch-title {
        font-family: var(--font-mono);
        font-size: clamp(3.5rem, 12vw, 5.5rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.05em;
        margin-bottom: 0.5rem;
        color: var(--text-primary);
      }

      .error-heading {
        font-size: 1.5rem;
        font-weight: 800;
        margin-bottom: 1rem;
        letter-spacing: -0.02em;
      }

      .error-desc {
        color: var(--text-muted);
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .actions-grid {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }

      @media (min-width: 480px) {
        .actions-grid {
          flex-direction: row;
          justify-content: center;
        }
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.85rem 1.35rem;
        font-size: 0.95rem;
        font-weight: 800;
        text-decoration: none;
        border: 3px solid var(--border-color);
        border-radius: 6px;
        box-shadow: 4px 4px 0px var(--shadow-color);
        transition: transform 0.1s ease, box-shadow 0.1s ease;
        cursor: pointer;
      }

      .btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px var(--shadow-color);
      }

      .btn:active {
        transform: translate(2px, 2px);
        box-shadow: 0px 0px 0px var(--shadow-color);
      }

      .btn-primary {
        background: var(--color-primary);
        color: #000000;
      }

      .btn-secondary {
        background: var(--color-accent-blue);
        color: #000000;
      }

      .btn-whatsapp {
        background: #25D366;
        color: #000000;
      }

      .footer-note {
        margin-top: 2rem;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-muted);
        font-family: var(--font-mono);
      }
    </style>
  </head>
  <body>
    <div class="error-card">
      <div class="badge-404">HTTP ERROR 404</div>
      <h1 class="glitch-title">404</h1>
      <h2 class="error-heading">Halaman Tidak Ditemukan</h2>
      <p class="error-desc">
        Tautan yang Anda tuju mungkin sudah dipindahkan, dihapus, atau salah ketik. Silakan kembali ke Studio Customizer atau jelajahi dokumentasi API kami.
      </p>

      <div class="actions-grid">
        <a href="/" class="btn btn-primary" data-track="404_home">
          <span>&larr; Ke Studio</span>
        </a>
        <a href="/#api-docs" class="btn btn-secondary" data-track="404_docs">
          <span>Dokumentasi API</span>
        </a>
        <a
          href="https://wa.me/6281234567890?text=Halo%20Mang%20Rusdi%2C%20saya%20menemukan%20halaman%20404%20di%20Quote%20Studio"
          target="_blank"
          rel="noopener noreferrer"
          class="btn btn-whatsapp"
          data-track="404_wa"
        >
          <span>Chat WhatsApp</span>
        </a>
      </div>

      <div class="footer-note">
        Quote Studio &bull; qc.mangrusdi.my.id
      </div>
    </div>
  </body>
</html>
